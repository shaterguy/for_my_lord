name: SelfRun Ddakhana Rebaseline

on:
  push:
    branches: ["v2.0.0-dev1"]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[ddakhana-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: v2.0.0-dev1
          fetch-depth: 0
      - name: Apply new product identity and UI state fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Build identity/signing model.
          Path('app/build.gradle.kts').write_text(r'''plugins {
              id("com.android.application")
          }

          fun ready(vararg values: String?) = values.all { !it.isNullOrBlank() }

          val releaseStoreFile = providers.environmentVariable("DDAKHANA_RELEASE_STORE_FILE").orNull
          val releaseStorePassword = providers.environmentVariable("DDAKHANA_RELEASE_STORE_PASSWORD").orNull
          val releaseKeyAlias = providers.environmentVariable("DDAKHANA_RELEASE_KEY_ALIAS").orNull
          val releaseKeyPassword = providers.environmentVariable("DDAKHANA_RELEASE_KEY_PASSWORD").orNull
          val releaseSigningReady = ready(
              releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword
          )

          val devStoreFile = providers.environmentVariable("DDAKHANA_DEV_STORE_FILE").orNull
          val devStorePassword = providers.environmentVariable("DDAKHANA_DEV_STORE_PASSWORD").orNull
          val devKeyAlias = providers.environmentVariable("DDAKHANA_DEV_KEY_ALIAS").orNull
          val devKeyPassword = providers.environmentVariable("DDAKHANA_DEV_KEY_PASSWORD").orNull
          val devSigningReady = ready(
              devStoreFile, devStorePassword, devKeyAlias, devKeyPassword
          )

          android {
              namespace = "com.shaterguy.hankan"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.shaterguy.ddakhana"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 20000
                  versionName = "2.0.0"
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              }

              signingConfigs {
                  if (releaseSigningReady) {
                      create("ddakhanaRelease") {
                          storeFile = file(releaseStoreFile!!)
                          storePassword = releaseStorePassword
                          keyAlias = releaseKeyAlias
                          keyPassword = releaseKeyPassword
                      }
                  }
                  if (devSigningReady) {
                      create("ddakhanaDev") {
                          storeFile = file(devStoreFile!!)
                          storePassword = devStorePassword
                          keyAlias = devKeyAlias
                          keyPassword = devKeyPassword
                      }
                  }
              }

              buildTypes {
                  debug {
                      applicationIdSuffix = ".local"
                      versionNameSuffix = "-local"
                      resValue("string", "app_name", "딱하나 LOCAL")
                  }
                  create("dev") {
                      isDebuggable = true
                      isMinifyEnabled = false
                      applicationIdSuffix = ".dev"
                      versionNameSuffix = "-dev1"
                      resValue("string", "app_name", "딱하나 DEV")
                      if (devSigningReady) signingConfig = signingConfigs.getByName("ddakhanaDev")
                  }
                  create("unsignedDev") {
                      initWith(getByName("dev"))
                      signingConfig = null
                      matchingFallbacks += listOf("dev", "debug")
                  }
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      if (releaseSigningReady) signingConfig = signingConfigs.getByName("ddakhanaRelease")
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
                  create("unsignedRelease") {
                      initWith(getByName("release"))
                      signingConfig = null
                      matchingFallbacks += listOf("release")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }

          tasks.configureEach {
              val stableDistribution = name == "assembleRelease" ||
                  name == "bundleRelease" || name.startsWith("packageRelease")
              if (stableDistribution) {
                  doFirst {
                      check(releaseSigningReady) {
                          "Stable release signing credentials are required. Refusing an ephemeral signer."
                      }
                  }
              }
              val devDistribution = name == "assembleDev" ||
                  name == "bundleDev" || name.startsWith("packageDev")
              if (devDistribution) {
                  doFirst {
                      check(devSigningReady) {
                          "Persistent DEV signing credentials are required. Refusing an ephemeral signer."
                      }
                  }
              }
          }

          dependencies {
              testImplementation("junit:junit:4.13.2")
          }
          ''', encoding='utf-8')

          p = Path('app/src/main/java/com/shaterguy/hankan/MainActivity.java')
          s = p.read_text(encoding='utf-8')

          def one(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              s = s.replace(old, new, 1)

          one('import android.content.res.Configuration;\n',
              'import android.content.res.ColorStateList;\nimport android.content.res.Configuration;\n', 'ColorStateList import')
          one('import android.graphics.drawable.GradientDrawable;\n',
              'import android.graphics.drawable.Drawable;\nimport android.graphics.drawable.GradientDrawable;\nimport android.graphics.drawable.RippleDrawable;\n', 'drawable imports')
          one('import android.os.CountDownTimer;\n',
              'import android.os.CountDownTimer;\nimport android.text.Editable;\nimport android.text.TextWatcher;\n', 'text imports')
          one('import java.util.Locale;\n',
              'import java.util.Locale;\nimport java.util.function.Consumer;\n', 'Consumer import')

          marker = '    private static final DateTimeFormatter RECORD_DATE =\n        DateTimeFormatter.ofPattern("M월 d일 (E)", Locale.KOREAN);\n'
          one(marker, marker + '''    private static final String STATE_RECORDS_TAB = "records_tab";\n    private static final String STATE_EDIT_TASK = "edit_task";\n    private static final String STATE_TASK_DRAFT = "task_draft";\n    private static final String STATE_NOTE_DRAFT = "note_draft";\n''', 'state constants')

          one('    private boolean recordsTab;\n    private boolean editTask;\n',
              '    private boolean recordsTab;\n    private boolean editTask;\n    private String taskDraft;\n    private String noteDraft;\n', 'draft fields')

          one('''        store = new HankanStore(this);\n        render();\n    }\n\n    @Override\n    protected void onResume() {''',
              '''        store = new HankanStore(this);\n        if (state != null) {\n            recordsTab = state.getBoolean(STATE_RECORDS_TAB, false);\n            editTask = state.getBoolean(STATE_EDIT_TASK, false);\n            taskDraft = state.getString(STATE_TASK_DRAFT);\n            noteDraft = state.getString(STATE_NOTE_DRAFT);\n        }\n        render();\n    }\n\n    @Override\n    protected void onSaveInstanceState(Bundle outState) {\n        outState.putBoolean(STATE_RECORDS_TAB, recordsTab);\n        outState.putBoolean(STATE_EDIT_TASK, editTask);\n        if (taskDraft != null) outState.putString(STATE_TASK_DRAFT, taskDraft);\n        if (noteDraft != null) outState.putString(STATE_NOTE_DRAFT, noteDraft);\n        super.onSaveInstanceState(outState);\n    }\n\n    @Override\n    protected void onResume() {''', 'saved state')

          one('TextView title = text("한칸", 34, ink, true);',
              'TextView title = text("딱하나", 34, ink, true);', 'title')

          # Preserve edit mode when crossing tabs so unsaved task draft comes back intact.
          one('''            recordsTab = false;\n            editTask = false;\n            render();''',
              '''            recordsTab = false;\n            render();''', 'today tab edit preservation')
          one('''            recordsTab = true;\n            editTask = false;\n            render();''',
              '''            recordsTab = true;\n            render();''', 'records tab edit preservation')

          one('''            EditText input = input("오늘 이것 하나만 끝내면 됩니다", false);\n            input.setText(task);\n            input.setSelection(input.length());''',
              '''            if (taskDraft == null) taskDraft = task;\n            EditText input = input("오늘 이것 하나만 끝내면 됩니다", false);\n            input.setText(taskDraft);\n            input.setSelection(input.length());\n            input.addTextChangedListener(draftWatcher(value -> taskDraft = value));''', 'task draft watcher')
          one('String value = input.getText().toString().trim();',
              'String value = taskDraft == null ? "" : taskDraft.trim();', 'task save source')
          one('''                store.setTask(date, value);\n                editTask = false;''',
              '''                store.setTask(date, value);\n                taskDraft = value;\n                editTask = false;''', 'task save draft')
          one('''                cancel.setOnClickListener(v -> {\n                    editTask = false;''',
              '''                cancel.setOnClickListener(v -> {\n                    taskDraft = task;\n                    editTask = false;''', 'task cancel draft')
          one('''            edit.setOnClickListener(v -> {\n                editTask = true;''',
              '''            edit.setOnClickListener(v -> {\n                taskDraft = task;\n                editTask = true;''', 'task edit draft')

          one('''        EditText note = input("잊기 전에 적어두세요.", true);\n        note.setText(store.getNote(date));\n        note.setSelection(note.length());''',
              '''        if (noteDraft == null) noteDraft = store.getNote(date);\n        EditText note = input("잊기 전에 적어두세요.", true);\n        note.setText(noteDraft);\n        note.setSelection(note.length());\n        note.addTextChangedListener(draftWatcher(value -> noteDraft = value));''', 'note draft watcher')
          one('store.setNote(date, note.getText().toString());',
              'store.setNote(date, noteDraft == null ? "" : noteDraft);', 'note save source')
          one('summary.append("한칸 · ")', 'summary.append("딱하나 · ")', 'share title')

          one('''        b.setBackground(roundRect(selected ? primary : Color.TRANSPARENT, dp(13), Color.TRANSPARENT, 0));''',
              '''        b.setBackground(interactiveBackground(selected ? primary : Color.TRANSPARENT, dp(13), Color.TRANSPARENT, 0));''', 'tab ripple')
          one('''        b.setBackground(roundRect(selected ? primaryContainer : surfaceAlt, dp(13), selected ? primary : outline, dp(1)));''',
              '''        b.setBackground(interactiveBackground(selected ? primaryContainer : surfaceAlt, dp(13), selected ? primary : outline, dp(1)));''', 'chip ripple')
          one('''        b.setBackground(roundRect(primaryAction ? primary : primaryContainer, dp(14), Color.TRANSPARENT, 0));''',
              '''        b.setBackground(interactiveBackground(primaryAction ? primary : primaryContainer, dp(14), Color.TRANSPARENT, 0));''', 'button ripple')

          round_marker = '''    private GradientDrawable roundRect(int fill, int radius, int stroke, int strokeWidth) {\n        GradientDrawable bg = new GradientDrawable();\n        bg.setColor(fill);\n        bg.setCornerRadius(radius);\n        if (strokeWidth > 0) bg.setStroke(strokeWidth, stroke);\n        return bg;\n    }\n'''
          one(round_marker, round_marker + '''\n    private Drawable interactiveBackground(int fill, int radius, int stroke, int strokeWidth) {\n        GradientDrawable content = roundRect(fill, radius, stroke, strokeWidth);\n        GradientDrawable mask = roundRect(Color.WHITE, radius, Color.TRANSPARENT, 0);\n        int ripple = Color.argb(44, Color.red(primary), Color.green(primary), Color.blue(primary));\n        return new RippleDrawable(ColorStateList.valueOf(ripple), content, mask);\n    }\n\n    private TextWatcher draftWatcher(Consumer<String> onChange) {\n        return new TextWatcher() {\n            @Override public void beforeTextChanged(CharSequence s, int start, int count, int after) {}\n            @Override public void onTextChanged(CharSequence s, int start, int before, int count) {\n                onChange.accept(s.toString());\n            }\n            @Override public void afterTextChanged(Editable s) {}\n        };\n    }\n''', 'interactive helpers')

          p.write_text(s, encoding='utf-8')

          # Widget action namespace and product wording.
          p = Path('app/src/main/java/com/shaterguy/hankan/HankanWidgetProvider.java')
          w = p.read_text(encoding='utf-8')
          w = w.replace('com.shaterguy.hankan.action.COMPLETE_TODAY', 'com.shaterguy.ddakhana.action.COMPLETE_TODAY')
          w = w.replace('"한칸 열기"', '"딱하나 열기"')
          p.write_text(w, encoding='utf-8')

          Path('app/src/main/res/values/strings.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <string name="app_name">딱하나</string>\n    <string name="widget_description">오늘의 딱 하나와 연속 기록을 보여주는 위젯</string>\n</resources>\n''', encoding='utf-8')

          Path('SIGNING_CERT_SHA256.txt').write_text('6d96451f4496a18eb032f0a379ef9a6d4eca7b9c2a24579f3d95507eb2e05548\n', encoding='utf-8')
          Path('DEV_SIGNING_CERT_SHA256.txt').write_text('0e8da24f8cafe9a9296a8f0a57dce20a53a351ed3d9942b0a9166a1f95b21f0b\n', encoding='utf-8')

          Path('README.md').write_text('''# 딱하나\n\n오늘 꼭 끝낼 딱 하나를 정하고, 짧게 집중하고, 기록을 남기는 오프라인 Android 앱입니다.\n\n## 주요 기능\n\n- 오늘의 딱 하나: 날짜별 목표 저장·수정·완료·완료 취소\n- 집중: 10·25·50분 프리셋, 일시정지·재개, 앱 재시작 뒤 상태 복원\n- 기록: 최근 7일 완료 현황, 날짜별 작업·집중·메모, 누적 통계\n- 생각 보관함: 기기 내부에만 저장되는 날짜별 메모\n- 오늘의 작은 재미: 가족과 함께할 짧은 활동 추천\n- 홈 화면 위젯: 오늘 목표·연속 기록 확인 및 완료\n- 오늘 요약 공유: 작업과 집중 기록만 Android Sharesheet로 공유\n- 시스템 Light/Dark, 회전 및 넓은 화면 대응\n- 로그인·광고·분석 SDK·네트워크 권한 없음\n\n## 설치 계보\n\n정식 앱 ID는 `com.shaterguy.ddakhana`, DEV 앱 ID는 `com.shaterguy.ddakhana.dev`입니다. 기존 `한칸` 앱과는 별개의 신규 앱이며 서로 동시에 설치할 수 있습니다.\n\n정식과 DEV는 각각 별도의 영속 RSA-4096 서명 계보를 사용합니다. 공개 저장소에는 개인키나 비밀번호를 넣지 않고 공개 인증서 SHA-256 지문만 둡니다.\n\n## 빌드\n\nJDK 17과 Gradle 8.10.2가 필요합니다.\n\n```bash\ngradle testUnsignedDevUnitTest testUnsignedReleaseUnitTest\ngradle assembleUnsignedDev assembleUnsignedRelease\n```\n\n`unsignedDev`와 `unsignedRelease`는 외부 영속 키로 서명하기 위한 검증용 중간 산출물입니다. `assembleDev`와 `assembleRelease`는 각 영속 서명 자격증명이 없으면 의도적으로 실패합니다.\n\n## 개인정보·백업\n\n사용 기록과 메모는 앱 전용 `SharedPreferences`에 저장됩니다. 메모는 공유 payload에 포함되지 않습니다. 앱 데이터의 cloud backup과 device-to-device transfer도 제외합니다.\n\n## 지원\n\nAndroid 8.0(API 26) 이상을 지원합니다.\n\n## 라이선스\n\n개인 프로젝트 용도로 제작되었습니다.\n''', encoding='utf-8')

          Path('RELEASE_NOTES.md').write_text('''## 딱하나 2.0.0\n\n오늘 꼭 끝낼 하나에 집중하도록 만든 신규 오프라인 Android 앱의 첫 정식 릴리즈입니다.\n\n- `오늘 / 기록` 2영역 개인 대시보드\n- 오늘의 딱 하나 저장·수정·완료·취소\n- 10·25·50분 집중 타이머와 세션 복원\n- 중복 집계를 막는 집중 세션 ID\n- 날짜별 메모, 완료 기록, 집중 통계\n- 최근 7일 현황 및 누적 기록\n- 메모를 제외한 오늘 요약 Android 공유\n- 홈 화면 위젯\n- 시스템 라이트/다크 모드, 회전, 넓은 화면 대응\n- 회전·화면 재구성에서도 저장 전 입력 초안 보존\n- 정식/DEV 분리 설치 및 각각의 영속 서명 계보\n- 로그인·광고·분석 SDK·네트워크 권한 없음\n\n기존 `한칸`은 변경하지 않으며 `딱하나`와 별개 앱으로 설치됩니다.\n''', encoding='utf-8')
          PY

          git config user.name "SelfRun Builder"
          git config user.email "actions@users.noreply.github.com"
          git add app/build.gradle.kts \
                  app/src/main/java/com/shaterguy/hankan/MainActivity.java \
                  app/src/main/java/com/shaterguy/hankan/HankanWidgetProvider.java \
                  app/src/main/res/values/strings.xml \
                  README.md RELEASE_NOTES.md SIGNING_CERT_SHA256.txt DEV_SIGNING_CERT_SHA256.txt
          git diff --cached --check
          git commit -m "feat: rebaseline as Ddakhana 2.0.0 [ddakhana-applied]"
          git push origin HEAD:v2.0.0-dev1
