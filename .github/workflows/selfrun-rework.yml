name: SelfRun export Android signing tool

on:
  push:
    branches: ["selfrun-rework-hankan-110"]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Collect apksigner tool
        run: |
          TOOL="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$TOOL"
          TOOL_DIR="$(dirname "$TOOL")"
          test -s "$TOOL_DIR/lib/apksigner.jar"
          mkdir -p export/lib
          cp "$TOOL" export/apksigner
          cp "$TOOL_DIR/lib/apksigner.jar" export/lib/apksigner.jar
          chmod +x export/apksigner
          "$TOOL" version
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-tool
          path: export
          if-no-files-found: error
