name: Android CI

on:
  push:
    branches: ["main", "v*-dev*", "v*-rc*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.10.2"
      - name: Test DEV and release logic
        run: gradle testUnsignedDevUnitTest testUnsignedReleaseUnitTest --stacktrace
      - name: Build unsigned DEV and release APKs
        run: gradle assembleUnsignedDev assembleUnsignedRelease --stacktrace
      - name: Assert distributable builds fail closed without signing credentials
        run: |
          if gradle assembleDev --stacktrace > dev-signing-fail.log 2>&1; then
            cat dev-signing-fail.log
            echo "assembleDev unexpectedly succeeded without persistent DEV signing credentials" >&2
            exit 1
          fi
          grep -F "Persistent DEV signing credentials are required" dev-signing-fail.log
          if gradle assembleRelease --stacktrace > release-signing-fail.log 2>&1; then
            cat release-signing-fail.log
            echo "assembleRelease unexpectedly succeeded without stable signing credentials" >&2
            exit 1
          fi
          grep -F "Stable release signing credentials are required" release-signing-fail.log
      - name: Verify package identities and build artifacts
        run: |
          DEV_APK="$(find app/build/outputs/apk/unsignedDev -name '*.apk' -type f | head -1)"
          RELEASE_APK="$(find app/build/outputs/apk/unsignedRelease -name '*.apk' -type f | head -1)"
          test -n "$DEV_APK" && test -s "$DEV_APK"
          test -n "$RELEASE_APK" && test -s "$RELEASE_APK"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT"
          DEV_PACKAGE="$($AAPT dump badging "$DEV_APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          RELEASE_PACKAGE="$($AAPT dump badging "$RELEASE_APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)"
          test "$DEV_PACKAGE" = "com.shaterguy.ddakhana.dev"
          test "$RELEASE_PACKAGE" = "com.shaterguy.ddakhana"
          sha256sum "$DEV_APK" "$RELEASE_APK"
          echo "DEV_APK=$DEV_APK" >> "$GITHUB_ENV"
          echo "RELEASE_APK=$RELEASE_APK" >> "$GITHUB_ENV"
      - name: Verify staged signed candidates when present
        run: |
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          verify_candidate() {
            SIGNED="$1"
            UNSIGNED="$2"
            SHA_FILE="$3"
            CERT_FILE="$4"
            test -s "$SIGNED"
            test -s "$SHA_FILE"
            (cd "$(dirname "$SIGNED")" && sha256sum -c "$(basename "$SHA_FILE")")
            VERIFY_OUT="$($APKSIGNER verify --verbose --print-certs "$SIGNED")"
            printf '%s\n' "$VERIFY_OUT"
            ACTUAL_CERT="$(printf '%s\n' "$VERIFY_OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')"
            EXPECTED_CERT="$(tr -d '[:space:]' < "$CERT_FILE" | tr '[:upper:]' '[:lower:]')"
            test -n "$ACTUAL_CERT" && test "$ACTUAL_CERT" = "$EXPECTED_CERT"
            python3 - "$SIGNED" "$UNSIGNED" <<'PY'
          import hashlib, sys, zipfile
          signed, unsigned = sys.argv[1:]
          def payload(path):
              with zipfile.ZipFile(path) as z:
                  return {
                      i.filename: hashlib.sha256(z.read(i.filename)).hexdigest()
                      for i in z.infolist()
                      if not i.is_dir() and not i.filename.startswith('META-INF/')
                  }
          a, b = payload(signed), payload(unsigned)
          if a != b:
              missing = sorted(set(b) - set(a))
              extra = sorted(set(a) - set(b))
              changed = sorted(k for k in set(a) & set(b) if a[k] != b[k])
              raise SystemExit(f'APK payload mismatch: missing={missing} extra={extra} changed={changed}')
          print(f'payload-equivalent entries={len(a)}')
          PY
          }
          STABLE="dist/ddakhana-v${VERSION}.apk"
          DEV="dist/ddakhana-v${VERSION}-dev1.apk"
          if [ -e "$STABLE" ]; then
            verify_candidate "$STABLE" "$RELEASE_APK" "$STABLE.sha256" SIGNING_CERT_SHA256.txt
          fi
          if [ -e "$DEV" ]; then
            verify_candidate "$DEV" "$DEV_APK" "$DEV.sha256" DEV_SIGNING_CERT_SHA256.txt
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ddakhana-unsigned-dev-apk
          path: app/build/outputs/apk/unsignedDev/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ddakhana-unsigned-release-apk
          path: app/build/outputs/apk/unsignedRelease/*.apk
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "8.10.2"
      - name: Rebuild and verify pre-signed distribution asset
        id: release_meta
        run: |
          gradle assembleUnsignedRelease --stacktrace
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)"
          test -n "$VERSION"
          ASSET="dist/ddakhana-v${VERSION}.apk"
          SHA_FILE="${ASSET}.sha256"
          UNSIGNED="$(find app/build/outputs/apk/unsignedRelease -name '*.apk' -type f | head -1)"
          test -s "$ASSET" && test -s "$SHA_FILE" && test -s "$UNSIGNED"
          (cd dist && sha256sum -c "$(basename "$SHA_FILE")")
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          VERIFY_OUT="$($APKSIGNER verify --verbose --print-certs "$ASSET")"
          printf '%s\n' "$VERIFY_OUT"
          ACTUAL_CERT="$(printf '%s\n' "$VERIFY_OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr '[:upper:]' '[:lower:]')"
          EXPECTED_CERT="$(tr -d '[:space:]' < SIGNING_CERT_SHA256.txt | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL_CERT" && test "$ACTUAL_CERT" = "$EXPECTED_CERT"
          python3 - "$ASSET" "$UNSIGNED" <<'PY'
          import hashlib, sys, zipfile
          signed, unsigned = sys.argv[1:]
          def payload(path):
              with zipfile.ZipFile(path) as z:
                  return {i.filename: hashlib.sha256(z.read(i.filename)).hexdigest() for i in z.infolist() if not i.is_dir() and not i.filename.startswith('META-INF/')}
          if payload(signed) != payload(unsigned):
              raise SystemExit('signed release payload differs from exact main rebuild')
          print('release payload equivalence verified')
          PY
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "sha_file=$SHA_FILE" >> "$GITHUB_OUTPUT"
      - name: Create immutable version tag
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            test "$(git rev-list -n 1 "$TAG")" = "$GITHUB_SHA"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release_meta.outputs.version }}
          ASSET: ${{ steps.release_meta.outputs.asset }}
          SHA_FILE: ${{ steps.release_meta.outputs.sha_file }}
        run: |
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "$SHA_FILE" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$ASSET" "$SHA_FILE" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "딱하나 ${VERSION}" \
              --notes-file RELEASE_NOTES.md
          fi
